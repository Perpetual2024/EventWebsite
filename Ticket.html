<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="global-navbar"></div>
    <section id="tickets">
      <hr><h1>Buy Your Ticket</h1><hr>
      <p>Choose your ticket and fill in your details. This demo form does not process real payments.</p>
      <form id="ticket-form">
        <label for="full-name"><strong>Full name</strong></label>
        <input type="text" id="full-name" required placeholder="Enter your full name">

        <label for="email"><strong>Email address</strong></label>
        <input type="email" id="email" required placeholder="you@example.com">
        
        <input type="radio" value="MALE" name="gender" id="male" required>
        <label for="male">Male</label>
        <input type="radio" value="FEMALE" name="gender" id="female" required>
        <label for="female">Female</label>

        <label for="ticket-type"><strong>Ticket type</strong></label>
        <select id="ticket-type" required>
          <option value="500">Regular — KSh 500</option>
          <option value="1000">VIP — KSh 1,000</option>
        </select>
        <label for="quantity"><strong>Number of tickets</strong></label>
        <input type="number" id="quantity" min="1" max="10" value="1" required>

        <p class="total">Total: KSh <span id="total-price">500</span></p>
        <button type="submit" class="button">Reserve Ticket</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>
    <script src="script.js"></script>
</body>
</html>
